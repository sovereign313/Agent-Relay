telegram_token = "BOT_TOKEN"
# Alternatively, remove telegram_token and use:
# telegram_token_env = "AGENT_RELAY_TELEGRAM_TOKEN"

allowed_user_ids = [
  123456789
]

private_chats_only = true
project_roots = ["/mnt/external/projects"]
project_discovery_depth = 5
default_agent = "codex"
state_file = "./var/state.json"
log_file = "./var/agent-relay.log"
log_max_bytes = 10485760
log_backups = 3
queue_size = 5
max_message_bytes = 32768
task_timeout = "2h"

[discord]
enabled = false
# Prefer an environment variable. The Discord transport uses an outbound
# Gateway connection and does not require a webhook or inbound port.
token_env = "AGENT_RELAY_DISCORD_TOKEN"
allowed_user_ids = [
  "123456789012345678"
]
private_channels_only = true

[project_aliases]
harness-studio = "WaspLogic/HarnessStudio"
rapidrfq = "WaspLogic/RapidRFQ"

[agents.codex]
type = "codex"
command = "codex"
args = []
full_access = true

[agents.claude]
type = "claude"
command = "claude"
args = []
full_access = true
enabled = false

[agents.opencode]
type = "opencode"
command = "opencode"
args = []
full_access = true
enabled = false

[agents.grok]
type = "grok"
command = "grok"
args = []
full_access = true
enabled = false
