queue_size = 5
max_message_bytes = 32768
task_timeout = "2h"

[project_aliases]
harness-studio = "WaspLogic/HarnessStudio"
rapidrfq = "WaspLogic/RapidRFQ"

[codex]
command = "codex"
args = []
full_access = true
