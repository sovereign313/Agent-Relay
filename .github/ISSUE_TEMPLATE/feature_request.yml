name: Feature request
description: Propose a focused improvement to Agent Relay.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible behavior and transport interaction.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Explain any effect on authorization, filesystem access, command execution, or secret handling.
    validations:
      required: true
